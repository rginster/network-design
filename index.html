<style>
:root{
  --bg:#f4f6f9; --panel:#fff; --ink:#16202b; --mut:#5d6b7a; --line:#dde4ec;
  --acc:#00437a; --acc2:#0a7bc4; --ok:#1a7f52; --warn:#b8860b; --bad:#c0392b;
  --s1:#0a7bc4; --s2:#00437a; --s3:#7a5ea8; --rail:#1a7f52; --road:#b8860b;
  --r:10px; --sh:0 1px 2px rgba(20,35,55,.06),0 6px 20px rgba(20,35,55,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11161c; --panel:#1a222c; --ink:#e6edf5; --mut:#9aabbc; --line:#2b3745;
  --acc:#4da3e0; --acc2:#6db9ee; --ok:#4cc38a; --warn:#e0b341; --bad:#f0736a;
  --s1:#6db9ee; --s2:#4da3e0; --s3:#b394e0; --rail:#4cc38a; --road:#e0b341;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
.mono{font-variant-numeric:tabular-nums;
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace}

/* ---------- Kopfzeile ---------- */
header{position:sticky;top:0;z-index:40;background:var(--panel);
  border-bottom:1px solid var(--line);box-shadow:var(--sh)}
.hd{max-width:1720px;margin:0 auto;padding:10px 20px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:16px}
.brand .sub{color:var(--mut);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:transparent;cursor:pointer;font-size:13px}
.pill:hover{border-color:var(--acc2)}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--acc);color:#fff}

/* ---------- Raster ---------- */
.wrap{max-width:1720px;margin:0 auto;padding:18px 20px 80px;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:1180px){.wrap{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);overflow:hidden}
.card>h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);
  padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.card>h2 .badge{margin-left:auto;font-size:11px;text-transform:none;letter-spacing:0;
  padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.card .body{padding:14px}
.card.locked{opacity:.62}
.card.locked .body{pointer-events:none}
.card.mine>h2{color:var(--acc);background:color-mix(in srgb,var(--acc) 7%,transparent)}
details>summary{cursor:pointer;list-style:none;padding:12px 14px;font-size:13px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--mut);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";font-size:11px;transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr))}
.kpi{background:var(--panel);padding:11px 13px;border-right:1px solid var(--line);
  border-bottom:1px solid var(--line)}
.kpi .lab{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;
  line-height:1.25;min-height:2.5em}
.kpi .val{font-size:19px;font-weight:640;margin-top:3px;font-variant-numeric:tabular-nums;
  white-space:nowrap}
.kpi .sub{font-size:11.5px;color:var(--mut);margin-top:1px}
.kpi .val.bad{color:var(--bad)} .kpi .val.ok{color:var(--ok)}
.delta{font-size:11.5px;font-weight:600}
.delta.up{color:var(--bad)} .delta.dn{color:var(--ok)}

/* ---------- Tabellen ---------- */
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 7px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;
  letter-spacing:.04em;position:sticky;top:0;background:var(--panel);z-index:2}
tbody tr:hover{background:color-mix(in srgb,var(--acc) 5%,transparent)}
tfoot td{font-weight:650;border-top:2px solid var(--line);border-bottom:0}
.scroll{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:8px}
.num{width:62px;text-align:right;padding:3px 6px;border:1px solid var(--line);
  border-radius:6px;background:var(--bg);font-variant-numeric:tabular-nums}
.num:focus{outline:2px solid var(--acc2);outline-offset:-1px}
select.pick{padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);width:100%}
.chk{width:16px;height:16px;accent-color:var(--acc);cursor:pointer}

/* ---------- Auslastungsbalken ---------- */
.bar{position:relative;height:7px;border-radius:4px;background:var(--line);overflow:hidden;min-width:70px}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:4px}
.bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}
.util{display:flex;align-items:center;gap:8px}
.util .pc{font-size:12px;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- Modal-Split-Schalter ---------- */
.mode{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mode button{border:0;background:transparent;padding:2px 7px;cursor:pointer;font-size:11px;color:var(--mut)}
.mode button.on{color:#fff}
.mode button.on[data-m="0"]{background:var(--rail)}
.mode button.on[data-m="1"]{background:var(--road)}

/* ---------- Hinweise ---------- */
.note{font-size:12.5px;color:var(--mut);line-height:1.55}
.alert{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border-radius:8px;font-size:12.5px;line-height:1.5;
  background:color-mix(in srgb,var(--bad) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);margin-bottom:7px}
.alert.ok{background:color-mix(in srgb,var(--ok) 10%,transparent);
  border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;
  background:var(--bg);border:1px solid var(--line);color:var(--mut)}

/* ---------- Karte ---------- */
.mapwrap{position:relative;background:var(--panel)}
svg.map{display:block;width:100%;height:auto}
.leg{display:flex;flex-wrap:wrap;gap:12px;padding:9px 14px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--mut)}
.leg span{display:inline-flex;align-items:center;gap:5px}
.leg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.btn{padding:7px 14px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);
  color:#fff;cursor:pointer;font-size:13px;font-weight:550}
.btn:hover{background:var(--acc2);border-color:var(--acc2)}
.btn.ghost{background:transparent;color:var(--acc);}
.btn.ghost:hover{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);padding:8px;font-family:ui-monospace,monospace;font-size:11px}

/* ---------- Hinweisbanner Optimierungsloesung (Lehrversion) ---------- */
.card.mine{border-color:color-mix(in srgb,var(--acc) 38%,var(--line));
  box-shadow:var(--sh),0 0 0 1px color-mix(in srgb,var(--acc) 22%,transparent)}

/* ---------- anklickbare Meldungen ---------- */
.alert.clickable{cursor:pointer;transition:background .12s}
.alert.clickable:hover{background:color-mix(in srgb,var(--bad) 18%,transparent)}
.alert .goto{margin-left:auto;font-weight:600;color:var(--bad);white-space:nowrap;padding-left:10px}

/* ---------- Sprungmarkierung ---------- */
@keyframes vwflash{
  0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,0)}
  15%,55%{box-shadow:0 0 0 3px rgba(192,57,43,.55)}
}
.flash{animation:vwflash 1.1s ease-in-out 2;border-color:var(--bad)!important;
  position:relative;z-index:3}

/* ===================================================================
   Ueberarbeitung 2026-09: Stufen, Status, Diagramm, Speicherpunkte
   =================================================================== */
.chip{display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:18px;height:18px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;line-height:1}
thead th .chip{width:15px;height:15px;font-size:9.5px;vertical-align:-3px}

/* Einstieg */
.intro>summary{font-size:13px}
.intro .lead{margin:0 0 12px;font-size:14px;line-height:1.55}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px;
  padding:10px;border:1px dashed var(--line);border-radius:8px}
.fnode{padding:4px 9px;border-radius:6px;background:var(--bg);border:1px solid var(--line);
  font-size:12.5px;font-weight:600}
.farrow{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--mut)}
.farrow::after{content:"→";font-size:15px;color:var(--c)}
.intro p.note{margin:0 0 8px}

/* Meldungen */
.alhd{font-size:12px;font-weight:650;color:var(--bad);margin:0 0 8px;text-transform:uppercase;letter-spacing:.05em}
.alert .chip{margin-top:1px}

/* Stufen-Tabs */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.tab{display:flex;align-items:center;gap:9px;padding:11px 12px;border:0;border-right:1px solid var(--line);
  background:var(--bg);cursor:pointer;text-align:left;border-bottom:3px solid transparent;min-width:0}
.tab:last-child{border-right:0}
.tab:hover{background:color-mix(in srgb,var(--acc) 6%,var(--panel))}
.tab.on{background:var(--panel);border-bottom-color:var(--acc)}
.tab .tl{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.tab .tl b{font-size:13.5px}
.tab .tl small{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbadge{margin-left:auto;flex:none;min-width:22px;height:20px;padding:0 6px;border-radius:999px;
  font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.tbadge.bad{background:var(--bad);color:#fff}
.tbadge.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.stagehd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.stagehd h3{font-size:15px}
.stagehd .note{flex-basis:100%;margin-left:27px}
#stages .scroll{max-height:none}
tr.grp-start td{border-top:2px solid var(--line)}
.cellnote{font-size:10.5px;color:var(--mut);margin-top:1px;line-height:1.3}
.cellnote.strong{color:var(--warn);font-weight:600}
.cellnote .need{color:var(--acc);font-weight:650}
td.idle{opacity:.45}
.btn.mini{padding:1px 7px;font-size:11px;font-weight:600;border-radius:6px}
@media(max-width:640px){.tab .tl small{display:none}}

/* Status und Kennzahlen */
.status{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:var(--r);
  border:1px solid;box-shadow:var(--sh)}
.status.ok{background:color-mix(in srgb,var(--ok) 12%,var(--panel));border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.status.bad{background:color-mix(in srgb,var(--bad) 11%,var(--panel));border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.status .sico{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#fff;font-size:16px}
.status.ok .sico{background:var(--ok)} .status.bad .sico{background:var(--bad)}
.status b{font-size:14.5px}
.status.ok b{color:var(--ok)} .status.bad b{color:var(--bad)}
.status .sh{font-size:12px;color:var(--mut);margin-top:2px}
.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{grid-column:span 2} .kpi.big{grid-column:span 3}
.kpi.big .val{font-size:24px}
.kpi.big .lab{min-height:0}
.kpi:not(.big) .lab{min-height:2.5em}
@media(max-width:560px){.kpi,.kpi.big{grid-column:span 6}}
.delta:not(.up):not(.dn){color:var(--mut)}
.strip{padding:9px 14px}
.srow{display:flex;gap:6px 16px;align-items:baseline;flex-wrap:wrap}
.srow+.srow{margin-top:4px}
.slab{font-size:12px;color:var(--mut)}
.di{font-size:13px}

/* Diagramm */
svg.chart{display:block;width:100%;height:auto}
svg.chart .pt.click{cursor:pointer}
svg.chart .pt.click:hover{opacity:.75}
.leg .sep{width:1px;height:14px;background:var(--line)}
.leg svg{flex:none}

/* Speicherpunkte */
.txt{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0;flex:1 1 160px}
.txt:focus{outline:2px solid var(--acc2);outline-offset:-1px}
.txt.flat{border-color:transparent;background:transparent;padding:2px 4px;font-weight:600;width:100%;flex:none}
.txt.flat:hover{border-color:var(--line)}
table.snaps td{vertical-align:top;white-space:normal}
table.snaps td.mono{white-space:nowrap;padding-top:8px}
table.snaps tr.active td{background:color-mix(in srgb,var(--s3) 9%,transparent)}
table.snaps td.okc,table.snaps td.badc{white-space:nowrap;font-size:12px;font-weight:600;padding-top:8px}
td.okc{color:var(--ok)} td.badc{color:var(--bad)}
table.snaps td.acts{white-space:nowrap;padding-top:6px;width:1%}
td.acts .btn{margin-left:3px}
.tags{display:flex;flex-wrap:wrap;gap:4px;padding:0 4px}
.tag.on{background:var(--s3);color:#fff;border-color:var(--s3)}
.tag.good{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.btn.danger.armed{background:var(--bad);color:#fff}

/* Live-Auslastung je Stufe */
.mlab{font-size:11px;font-weight:650;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px}
.meters{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:8px;margin-bottom:12px}
.meter{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--bg)}
.meter.bad{border-color:color-mix(in srgb,var(--bad) 55%,transparent);background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.meter.warn{border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.meter .mh{display:flex;flex-wrap:wrap;column-gap:6px;align-items:baseline;font-size:12px;margin-bottom:4px}
.meter .mh b{white-space:nowrap}
.meter .mv{margin-left:auto;font-size:11px;color:var(--mut);white-space:nowrap}
.meter .mf{display:block;font-size:11px;color:var(--mut);margin-top:3px}
.meter.bad .mf{color:var(--bad);font-weight:650}
.meter .bar{min-width:0}

</style>
</head>

   hier sind Lehrparameter. Jeder Wert traegt ein Quellen-/Status-Feld:
     "lit"  = Wert liegt im Bereich der angegebenen Literaturquelle
     "anc"  = aus einer publizierten Groesse hergeleitet (Anker angegeben)
     "did"  = didaktische Setzung ohne Literaturbeleg (frei zu waehlen)
   Die Herleitung jedes Wertes ist in README.md dokumentiert.
   =================================================================== */
window.VWEMI = (function () {

  const P = {

    // --- Strommix je Land [kg CO2e / kWh el] ---------------------------
    // Groessenordnung nach EEA-Indikator "GHG emission intensity of
    // electricity generation" (Laenderwerte, gerundet). Status: lit
    grid: { DE:0.380, PL:0.750, CZ:0.440, HU:0.220, SK:0.110 },

    // --- Gruenstromanteil je Standort [0..1] ---------------------------
    // Default 0 = kein PPA. Preset "Salzgitter gruen" setzt VWN auf 0.9
    // (VW/Northvolt-Narrativ der Fallstudie). Status: did
    green: { CATL:0, SKI:0, VWN:0, LG:0, BS:0, MB:0,
             BTS:0, EMD:0, HAN:0, MBV:0, WOB:0, ZWI:0 },

    // --- Zellmodul-Fertigung -------------------------------------------
    // Aufgeteilt in standortunabhaengigen Materialanteil und
    // standortabhaengigen Stromanteil:
    //   e = cellMat + cellElec * grid(Standort)      [kg CO2e / kWh Zelle]
    // Anker: Emilsson & Dahlloef (2019), IVL C444: 61-106 kg CO2e/kWh.
    // Mit DE-Mix ergibt sich 60+35*0.38 = 73 kg/kWh (Mitte des Bandes),
    // mit PL-Mix 86, mit HU-Mix 68, mit Gruenstrom 61. Status: anc
    cellMat:  60.0,   // kg CO2e / kWh Zellkapazitaet (Material, Vorkette)
    cellElec: 35.0,   // kWh Strom / kWh Zellkapazitaet (Fertigung)

    // --- Batteriesystem-Montage (Modul -> System) ----------------------
    //   e = packMat + packElec * grid(Batteriewerk)  [kg CO2e / kWh System]
    // Anker: Dai et al. (2019), Batteries 5(2):48 — Modul-/Pack-Montage
    // benoetigt nur geringe Energiemengen gegenueber der Zellfertigung.
    // Status: anc (Groessenordnung), did (exakte Werte)
    packMat:  3.0,    // kg CO2e / kWh System
    packElec: 2.0,    // kWh Strom / kWh System

    // --- Fahrzeugproduktion (ohne Batterie) ----------------------------
    //   e = vehMat[Modell] + vehElec * grid(Fahrzeugwerk)  [kg CO2e / Fzg]
    // Anker: Volkswagen AG (2019/2020) LCA ID.3: 14,0 t CO2e Herstellung,
    // davon > 40 % Batteriesystem -> Glider/Montage ca. 8,1 t. Die uebrigen
    // Modelle sind ueber die Fahrzeugklasse skaliert. Status: anc (ID.3), did (Rest)
    vehMat: { 'ID.1':5500,'ID.2':6500,'ID.3':8100,'ID.4':9200,
              'ID.5':10200,'ID.6':10800,'ID.7':11500 },
    vehElec: 700,     // kWh Strom / Fahrzeug (Presswerk/Karosserie/Lack/Montage). Status: did

    // --- Transport [kg CO2e / tkm], Well-to-Wheel ----------------------
    // Die Fallstudie beschreibt den Batterietransport per Bahn und nennt
    // nur EINEN Kostensatz je Einheit und km. Der Verkehrstraeger ist
    // deshalb keine Entscheidungsvariable; der Faktor gilt einheitlich.
    // Bandbreiten nach EcoTransIT World (Methodology Report), CE Delft
    // STREAM Freight Transport 2020 und UBA/TREMOD:
    //   Bahn (elektrisch, EU) ~0,02-0,03 ; Lkw 40 t ~0,08-0,12
    // Default = Bahn. Status: lit
    tTrans: 0.025,

    // --- Massen fuer die tkm-Rechnung ----------------------------------
    // Modul ~150 Wh/kg, Batteriesystem ~154 Wh/kg (ID.3: 58 kWh ~ 375 kg).
    // Status: anc
    massMod:  { 6:40, 8:53, 10:67 },        // kg / Modul
    massPack: 6.5,                          // kg / kWh Systemkapazitaet
    massVeh:  { 'ID.1':1500,'ID.2':1650,'ID.3':1800,'ID.4':2050,
                'ID.5':2200,'ID.6':2250,'ID.7':2300 },  // kg / Fahrzeug. Status: did

  };

  // Land je Standort-ID
  const CO = { CATL:'DE', SKI:'HU', VWN:'DE', LG:'PL', BS:'DE', MB:'CZ',
               BTS:'SK', EMD:'DE', HAN:'DE', MBV:'CZ', WOB:'DE', ZWI:'DE' };

  // effektive Stromintensitaet eines Standorts (inkl. Gruenstromanteil)
  function gridOf(id) {
    const g = P.grid[CO[id]] || 0;
    return g * (1 - (P.green[id] || 0));
  }

  const SRC = [
    { key:'grid',  st:'lit', ref:'EEA — Greenhouse gas emission intensity of electricity generation (Laenderindikator)' },
    { key:'cell',  st:'anc', ref:'Emilsson & Dahlloef (2019), IVL Report C444: 61-106 kg CO2e/kWh Batterieproduktion' },
    { key:'pack',  st:'anc', ref:'Dai, Kelly, Gaines & Wang (2019), Batteries 5(2):48 — Modul-/Pack-Montage energiearm' },
    { key:'veh',   st:'anc', ref:'Volkswagen AG (2019/2020), LCA ID.3: 14,0 t CO2e Herstellung, >40 % Batterie' },
    { key:'trans', st:'lit', ref:'EcoTransIT World Methodology Report; CE Delft STREAM Freight Transport 2020; UBA/TREMOD — Bahn ~0,025, Lkw ~0,100 kg CO2e/tkm' },
    { key:'mass',  st:'anc', ref:'Modul ~150 Wh/kg; ID.3-System 58 kWh ~ 375 kg' },
  ];

  return { P, CO, gridOf, SRC };
})();

;
/* ===================================================================
   VW SCND — Bewertungskern
   Nimmt einen vollstaendigen Materialfluss (x1,x2,x3) plus Modal Split
   entgegen und liefert Kosten, Emissionen, Auslastungen, Zulaessigkeit.
   Identisch genutzt von Studierenden- und Lehrversion.
   =================================================================== */
window.VWCORE = (function () {
  const D = window.VW, E = window.VWEMI;
  const nM = 3, nS = 4, nB = 2, nV = 6, nD = 3, nK = 7, nP = 15;
  const ki = {}; D.CAPS.forEach((k, i) => ki[k] = i);

  const zeros = (...dims) => dims.length === 1
    ? new Float64Array(dims[0])
    : Array.from({ length: dims[0] }, () => zeros(...dims.slice(1)));

  function emptyFlows() {
    return {
      x1: zeros(nM, nS, nB), x2: zeros(nK, nB, nV), x3: zeros(nP, nV, nD)
    };
  }

  // Emissionsfaktor je Einheit, standortabhaengig -----------------------
  const cellPerKwh = id => E.P.cellMat + E.P.cellElec * E.gridOf(id);          // kg/kWh Zelle
  const packPerKwh = id => E.P.packMat + E.P.packElec * E.gridOf(id);          // kg/kWh System
  const vehPerUnit = (model, id) => E.P.vehMat[model] + E.P.vehElec * E.gridOf(id); // kg/Fzg

  // Transport: einheitlicher Emissionsfaktor [kg CO2e / tkm].
  // Die Fallstudie nennt genau einen Kostensatz je Einheit und km, daher
  // wird der Verkehrstraeger nicht als Entscheidung gefuehrt.
  const tEF = () => E.P.tTrans;

  function evaluate(F, opt) {
    opt = opt || {};
    const P = E.P;
    const c = { procure:0, tSB:0, tBV:0, tVD:0, assembly:0, production:0, fixed:0 };
    const g = { cell:0, pack:0, vehicle:0, tSB:0, tBV:0, tVD:0 };   // kg CO2e
    const tkm = { l1:0, l2:0, l3:0 };
    const useS = zeros(nS), useB = zeros(nB), useV = zeros(nV);

    // --- Stufe 1: Lieferant -> Batteriewerk (Module) -------------------
    for (let m = 0; m < nM; m++) {
      const kwh = D.MOD[m].kwh, mass = P.massMod[kwh] / 1000;   // t je Modul
      for (let s = 0; s < nS; s++) {
        const ef = cellPerKwh(D.SUP[s].id) * kwh;               // kg CO2e je Modul
        for (let b = 0; b < nB; b++) {
          const q = F.x1[m][s][b]; if (!q) continue;
          const km = D.D1[s][b];
          useS[s] += q;
          c.procure += D.PROC[m][s] * q * (s === 3 ? (opt.lgFactor || 1) : 1);
          c.tSB     += km * D.TC.mod * q;
          g.cell    += ef * q;
          const t = mass * q * km; tkm.l1 += t; g.tSB += t * tEF();
        }
      }
    }

    // --- Stufe 2: Batteriewerk -> Fahrzeugwerk (Systeme) ---------------
    for (let k = 0; k < nK; k++) {
      const kwh = D.CAPS[k], mass = kwh * P.massPack / 1000;    // t je System
      for (let b = 0; b < nB; b++) {
        const ef = packPerKwh(D.BAP[b].id) * kwh;               // kg CO2e je System
        for (let v = 0; v < nV; v++) {
          const q = F.x2[k][b][v]; if (!q) continue;
          const km = D.D2[b][v];
          useB[b] += q;
          c.assembly += D.ASSY[kwh][b] * q;
          c.tBV      += km * D.TC.bat * q;
          g.pack     += ef * q;
          const t = mass * q * km; tkm.l2 += t; g.tBV += t * tEF();
        }
      }
    }

    // --- Stufe 3: Fahrzeugwerk -> Distributionszentrum -----------------
    for (let p = 0; p < nP; p++) {
      const mo = D.PROD[p].model, mass = P.massVeh[mo] / 1000;  // t je Fahrzeug
      for (let v = 0; v < nV; v++) {
        const ef = vehPerUnit(mo, D.VEH[v].id);
        for (let d = 0; d < nD; d++) {
          const q = F.x3[p][v][d]; if (!q) continue;
          const km = D.D3[v][d];
          useV[v] += q;
          c.production += D.PRODC[mo][v] * q;
          c.tVD        += km * D.TC.veh * q;
          g.vehicle    += ef * q;
          const t = mass * q * km; tkm.l3 += t; g.tVD += t * tEF();
        }
      }
    }

    // --- Fixkosten: Standort gilt als eroeffnet, sobald Fluss > 0 ------
    const openS = [], openB = [], openV = [];
    for (let s = 0; s < nS; s++) { openS[s] = useS[s] > 1e-6 ? 1 : 0; c.fixed += D.FIX.sup * openS[s]; }
    for (let b = 0; b < nB; b++) { openB[b] = useB[b] > 1e-6 ? 1 : 0; c.fixed += D.FIX.bap * openB[b]; }
    for (let v = 0; v < nV; v++) { openV[v] = useV[v] > 1e-6 ? 1 : 0; c.fixed += D.FIX.veh * openV[v]; }

    c.transport = c.tSB + c.tBV + c.tVD;
    c.total = c.procure + c.transport + c.assembly + c.production + c.fixed;
    g.transport = g.tSB + g.tBV + g.tVD;
    const gt = {}; for (const k in g) gt[k] = g[k] / 1000;      // kg -> t CO2e
    gt.total = gt.cell + gt.pack + gt.vehicle + gt.transport;
    tkm.total = tkm.l1 + tkm.l2 + tkm.l3;

    // --- Zulaessigkeit -------------------------------------------------
    const issues = [];
    const capS = s => D.CAP_S[s] * (s === 1 ? (opt.skFactor || 1) : 1);
    for (let s = 0; s < nS; s++) if (useS[s] > capS(s) + 1e-6)
      issues.push({ t:'capSup', i:s, name:D.SUP[s].city, use:useS[s], cap:capS(s) });
    for (let b = 0; b < nB; b++) if (useB[b] > D.CAP_B[b] + 1e-6)
      issues.push({ t:'capBap', i:b, name:D.BAP[b].city, use:useB[b], cap:D.CAP_B[b] });
    for (let v = 0; v < nV; v++) if (useV[v] > D.CAP_V[v] + 1e-6)
      issues.push({ t:'capVeh', i:v, name:D.VEH[v].city, use:useV[v], cap:D.CAP_V[v] });

    for (let p = 0; p < nP; p++) for (let d = 0; d < nD; d++) {
      let sum = 0; for (let v = 0; v < nV; v++) sum += F.x3[p][v][d];
      if (Math.abs(sum - D.DEMAND[p][d]) > 0.5)
        issues.push({ t:'demand', p, d, name:D.PROD[p].name + ' → ' + D.DC[d].city, use:sum, cap:D.DEMAND[p][d] });
    }
    for (let k = 0; k < nK; k++) for (let v = 0; v < nV; v++) {
      let inflow = 0, need = 0;
      for (let b = 0; b < nB; b++) inflow += F.x2[k][b][v];
      for (let p = 0; p < nP; p++) if (D.PROD[p].kwh === D.CAPS[k])
        for (let d = 0; d < nD; d++) need += F.x3[p][v][d];
      if (Math.abs(inflow - need) > 0.5)
        issues.push({ t:'flowV', name:D.CAPS[k] + ' kWh → ' + D.VEH[v].city, use:inflow, cap:need });
    }
    for (let m = 0; m < nM; m++) for (let b = 0; b < nB; b++) {
      let inflow = 0, need = 0;
      for (let s = 0; s < nS; s++) inflow += F.x1[m][s][b];
      for (let k = 0; k < nK; k++) { let q = 0; for (let v = 0; v < nV; v++) q += F.x2[k][b][v]; need += D.BOM[D.CAPS[k]][m] * q; }
      if (Math.abs(inflow - need) > 0.5)
        issues.push({ t:'flowB', name:D.MOD[m].name + ' → ' + D.BAP[b].city, use:inflow, cap:need });
    }

    return {
      cost:c, co2:gt, tkm,
      util:{ sup:Array.from(useS, (u,s) => u / capS(s)), bap:Array.from(useB, (u,b) => u / D.CAP_B[b]),
             veh:Array.from(useV, (u,v) => u / D.CAP_V[v]) },
      vol:{ sup:Array.from(useS), bap:Array.from(useB), veh:Array.from(useV) },
      open:{ sup:openS, bap:openB, veh:openV },
      feas:{ ok:issues.length === 0, issues }
    };
  }

  return { evaluate, emptyFlows, zeros, ki, dims:{ nM,nS,nB,nV,nD,nK,nP },
           cellPerKwh, packPerKwh, vehPerUnit };
})();

;
/* ===================================================================
   VW SCND — Entscheidungsmodell der Studierenden
   Drei Rollen, jede mit einem vollstaendigen Entscheidungsraum auf
   ihrer Wertschoepfungsstufe. Daraus wird der Materialfluss abgeleitet.
   =================================================================== */
window.VWDEC = (function () {
  const D = window.VW, C = window.VWCORE;
  const { nM,nS,nB,nV,nD,nK,nP } = C.dims;
  const clamp = v => Math.max(0, Math.min(100, +v || 0));

  // --- Ausgangsplanung der Fallstudie ---------------------------------
  function basePlan() {
    const S = {
      // Einkauf: Lieferantenanteil [%] je Modultyp und Batteriewerk       3 x 2 x 4
      supShare: C.zeros(nM, nB, nS),
      // Werkleitung Batterie: Anteil Braunschweig [%] je Kapazitaet und
      // Fahrzeugwerk; der Rest geht nach Mladá Boleslav                   7 x 6
      splitBat: C.zeros(nK, nV),
      // Werkleitung Fahrzeuge: welches Werk beliefert welches DC          15 x 3
      routeVeh: []
    };
    for (let m = 0; m < nM; m++) for (let b = 0; b < nB; b++) S.supShare[m][b][D.PLAN_SUP[m]] = 100;
    for (let k = 0; k < nK; k++) for (let v = 0; v < nV; v++) S.splitBat[k][v] = D.CAPS[k] <= 62 ? 100 : 0;
    for (let p = 0; p < nP; p++) { const v = D.PLAN_VEH[D.PROD[p].model]; S.routeVeh.push([v, v, v]); }
    return S;
  }

  // --- Materialfluss aus den Entscheidungen ---------------------------
  function deriveFlows(S) {
    const F = C.emptyFlows();

    // Stufe 3: Nachfrage folgt der Werkszuordnung
    for (let p = 0; p < nP; p++) for (let d = 0; d < nD; d++) {
      const v = S.routeVeh[p][d];
      if (v >= 0 && v < nV) F.x3[p][v][d] += D.DEMAND[p][d];
    }
    // Stufe 2: Batteriebedarf je Kapazitaet und Fahrzeugwerk, aufgeteilt
    for (let k = 0; k < nK; k++) for (let v = 0; v < nV; v++) {
      let need = 0;
      for (let p = 0; p < nP; p++) if (D.PROD[p].kwh === D.CAPS[k])
        for (let d = 0; d < nD; d++) need += F.x3[p][v][d];
      if (!need) continue;
      const sh = clamp(S.splitBat[k][v]) / 100;
      F.x2[k][0][v] = need * sh;
      F.x2[k][1][v] = need * (1 - sh);
    }
    // Stufe 1: Modulbedarf je Batteriewerk, verteilt nach Lieferantenanteilen
    for (let m = 0; m < nM; m++) for (let b = 0; b < nB; b++) {
      let need = 0;
      for (let k = 0; k < nK; k++) {
        let q = 0; for (let v = 0; v < nV; v++) q += F.x2[k][b][v];
        need += D.BOM[D.CAPS[k]][m] * q;
      }
      if (!need) continue;
      let w = 0; for (let s = 0; s < nS; s++) w += Math.max(0, S.supShare[m][b][s]);
      if (w <= 0) continue;
      for (let s = 0; s < nS; s++) F.x1[m][s][b] = need * Math.max(0, S.supShare[m][b][s]) / w;
    }
    return F;
  }

  // Pruefungen auf Ebene der Rollenentscheidungen
  function decisionIssues(S) {
    const out = [];
    for (let p = 0; p < nP; p++) for (let d = 0; d < nD; d++)
      if (!(S.routeVeh[p][d] >= 0 && S.routeVeh[p][d] < nV))
        out.push({ t:'noPlant', name:D.PROD[p].name + ' → ' + D.DC[d].city });
    for (let m = 0; m < nM; m++) for (let b = 0; b < nB; b++) {
      let w = 0; for (let s = 0; s < nS; s++) w += Math.max(0, S.supShare[m][b][s]);
      if (w <= 0) out.push({ t:'noSup', name:D.MOD[m].name + ' → ' + D.BAP[b].city });
    }
    return out;
  }

  // --- Kompakte Kodierung fuer Export/Import --------------------------
  function encode(S, meta) {
    const r1 = a => Array.from(a, x => Math.round(x)).join(',');
    const o = {
      v: 2, g: (meta && meta.group) || '',
      ss: S.supShare.map(a => a.map(r1).join(';')).join('|'),
      sb: S.splitBat.map(r1).join('|'),
      rv: S.routeVeh.map(r => r.map(x => (x < 0 ? 'x' : x)).join('')).join('')
    };
    return btoa(unescape(encodeURIComponent(JSON.stringify(o))));
  }
  function decode(code) {
    const o = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if (o.v !== 2) throw new Error('unsupported version');
    const S = basePlan();
    o.ss.split('|').forEach((a, m) => a.split(';').forEach((r, b) =>
      r.split(',').forEach((c, s) => S.supShare[m][b][s] = +c)));
    o.sb.split('|').forEach((r, k) => r.split(',').forEach((c, v) => S.splitBat[k][v] = +c));
    S.routeVeh = [];
    for (let p = 0; p < nP; p++) S.routeVeh.push(
      o.rv.slice(p*nD, p*nD+nD).split('').map(c => c === 'x' ? -1 : +c));
    return { S, group: o.g || '' };
  }

  return { basePlan, deriveFlows, decisionIssues, encode, decode, clamp };
})();

;

  let L = 1;                                   // 0 = DE, 1 = EN (Standard: EN)

/* ===================================================================
   VW SCND — LP/MILP-Loeser (Lehrversion; Studierendenversion nur mit CO2-Grenze)
   Dichtes Zwei-Phasen-Simplex + Branch-and-Bound ueber die 12
   Standort-Binaervariablen. Keine externen Bibliotheken.
   =================================================================== */
window.VWSOLVE = (function () {
  const D = window.VW, E = window.VWEMI, C = window.VWCORE;
  const { nM,nS,nB,nV,nD,nK,nP } = C.dims;
  const EPS = 1e-7;

  // ------------------------------------------------------------------
  //  Simplex: min c'x,  Zeilen {i:[],a:[],sense:'='|'<=',b:>=0},  x >= 0
  // ------------------------------------------------------------------
  function simplex(rows, c, n, opt) {
    const m = rows.length;
    let nslack = 0; rows.forEach(r => { if (r.sense === '<=') nslack++; });
    const nart = rows.reduce((a, r) => a + (r.sense === '=' ? 1 : 0), 0);
    const N = n + nslack + nart, W = N + 1;
    const T = new Float64Array((m + 1) * W);
    const basis = new Int32Array(m);
    let sp = n, ap = n + nslack;

    for (let i = 0; i < m; i++) {
      const r = rows[i], off = i * W;
      for (let j = 0; j < r.i.length; j++) T[off + r.i[j]] += r.a[j];
      T[off + N] = r.b;
      if (r.sense === '<=') { T[off + sp] = 1; basis[i] = sp++; }
      else                  { T[off + ap] = 1; basis[i] = ap++; }
    }

    const obj = m * W;
    function setPhase1() {
      T.fill(0, obj, obj + W);
      for (let j = n + nslack; j < N; j++) T[obj + j] = 1;   // Kosten der kuenstlichen Variablen
      for (let i = 0; i < m; i++) if (basis[i] >= n + nslack) {
        const off = i * W;
        for (let j = 0; j <= N; j++) T[obj + j] -= T[off + j];
      }
    }
    function setPhase2() {
      T.fill(0, obj, obj + W);
      for (let j = 0; j < n; j++) T[obj + j] = c[j];
      for (let i = 0; i < m; i++) {
        const bj = basis[i]; if (bj >= n || c[bj] === 0) continue;
        const f = c[bj], off = i * W;
        for (let j = 0; j <= N; j++) T[obj + j] -= f * T[off + j];
      }
    }

    function pivot(pr, pc) {
      const off = pr * W, pv = T[off + pc], inv = 1 / pv;
      for (let j = 0; j <= N; j++) T[off + j] *= inv;
      T[off + pc] = 1;
      for (let i = 0; i <= m; i++) {
        if (i === pr) continue;
        const o2 = i * W, f = T[o2 + pc];
        if (f === 0) continue;
        for (let j = 0; j <= N; j++) T[o2 + j] -= f * T[off + j];
        T[o2 + pc] = 0;
      }
      basis[pr] = pc;
    }

    function run(hi) {
      let it = 0, bland = false;
      const lim = opt && opt.iterLimit || 20000;
      for (;;) {
        if (++it > lim) return false;
        if (it > 4 * (m + N)) bland = true;
        let pc = -1, best = -1e-9;
        for (let j = 0; j < hi; j++) {
          const v = T[obj + j];
          if (v < best - 1e-12 || (bland && v < -1e-9)) { pc = j; if (bland) break; best = v; }
        }
        if (pc < 0) return true;
        let pr = -1, ratio = Infinity;
        for (let i = 0; i < m; i++) {
          const a = T[i * W + pc];
          if (a > 1e-9) {
            const r = T[i * W + N] / a;
            if (r < ratio - 1e-9 || (Math.abs(r - ratio) <= 1e-9 && pr >= 0 && basis[i] < basis[pr])) { ratio = r; pr = i; }
          }
        }
        if (pr < 0) return 'unbounded';
        pivot(pr, pc);
      }
    }

    if (nart) {
      setPhase1();
      if (run(n + nslack) !== true) return { status:'fail' };
      if (-T[obj + N] > 1e-5) return { status:'infeasible' };
      // Artifizielle Variablen aus der Basis draengen
      for (let i = 0; i < m; i++) if (basis[i] >= n + nslack) {
        let pc = -1, mx = 1e-9;
        for (let j = 0; j < n + nslack; j++) { const a = Math.abs(T[i * W + j]); if (a > mx) { mx = a; pc = j; } }
        if (pc >= 0) pivot(i, pc);
      }
    }
    setPhase2();
    const st = run(n + nslack);
    if (st === 'unbounded') return { status:'unbounded' };
    if (st !== true) return { status:'fail' };

    const x = new Float64Array(n);
    for (let i = 0; i < m; i++) if (basis[i] < n) x[basis[i]] = T[i * W + N];
    let z = 0; for (let j = 0; j < n; j++) z += c[j] * x[j];
    return { status:'optimal', x, z };
  }

  // ------------------------------------------------------------------
  //  Modellaufbau
  // ------------------------------------------------------------------
  function build(o) {
    o = o || {};
    const optMode = false, nMode = 1;            // Verkehrstraeger ist keine Entscheidung
    const n1 = nM * nS * nB * nMode, n2 = nK * nB * nV * nMode, n3 = nP * nV * nD * nMode;
    const O1 = 0, O2 = n1, O3 = n1 + n2, OY = n1 + n2 + n3;
    const n = OY + nS + nB + nV;
    const i1 = (m,s,b,z) => O1 + ((m*nS + s)*nB + b)*nMode + (optMode ? z : 0);
    const i2 = (k,b,v,z) => O2 + ((k*nB + b)*nV + v)*nMode + (optMode ? z : 0);
    const i3 = (p,v,d,z) => O3 + ((p*nV + v)*nD + d)*nMode + (optMode ? z : 0);
    const iys = s => OY + s, iyb = b => OY + nS + b, iyv = v => OY + nS + nB + v;

    const P = E.P;
    const lg = o.lgFactor || 1, sk = o.skFactor || 1;
    const capS = s => D.CAP_S[s] * (s === 1 ? sk : 1);
    const cost = new Float64Array(n), emi = new Float64Array(n);
    const eFix = () => P.tTrans;

    for (let m = 0; m < nM; m++) { const kwh = D.MOD[m].kwh, mass = P.massMod[kwh] / 1000;
      for (let s = 0; s < nS; s++) { const ec = C.cellPerKwh(D.SUP[s].id) * kwh;
        for (let b = 0; b < nB; b++) { const km = D.D1[s][b];
          for (let z = 0; z < nMode; z++) {
            const j = i1(m,s,b,z);
            cost[j] = D.PROC[m][s] * (s === 3 ? lg : 1) + km * D.TC.mod;
            emi[j]  = ec + mass * km * eFix();
          } } } }
    for (let k = 0; k < nK; k++) { const kwh = D.CAPS[k], mass = kwh * P.massPack / 1000;
      for (let b = 0; b < nB; b++) { const ec = C.packPerKwh(D.BAP[b].id) * kwh;
        for (let v = 0; v < nV; v++) { const km = D.D2[b][v];
          for (let z = 0; z < nMode; z++) {
            const j = i2(k,b,v,z);
            cost[j] = D.ASSY[kwh][b] + km * D.TC.bat;
            emi[j]  = ec + mass * km * eFix();
          } } } }
    for (let p = 0; p < nP; p++) { const mo = D.PROD[p].model, mass = P.massVeh[mo] / 1000;
      for (let v = 0; v < nV; v++) { const ec = C.vehPerUnit(mo, D.VEH[v].id);
        for (let d = 0; d < nD; d++) { const km = D.D3[v][d];
          for (let z = 0; z < nMode; z++) {
            const j = i3(p,v,d,z);
            cost[j] = D.PRODC[mo][v] + km * D.TC.veh;
            emi[j]  = ec + mass * km * eFix();
          } } } }
    // Standortvariablen werden skaliert gefuehrt: Y_j = cap_j * y_j.
    // Dadurch liegen alle Matrixkoeffizienten in der Groessenordnung 1..9,
    // was das dichte Simplex-Tableau numerisch stabil haelt.
    const yCap = [];
    for (let s = 0; s < nS; s++) { yCap[iys(s) - OY] = capS(s);      cost[iys(s)] = D.FIX.sup / capS(s); }
    for (let b = 0; b < nB; b++) { yCap[iyb(b) - OY] = D.CAP_B[b];   cost[iyb(b)] = D.FIX.bap / D.CAP_B[b]; }
    for (let v = 0; v < nV; v++) { yCap[iyv(v) - OY] = D.CAP_V[v];   cost[iyv(v)] = D.FIX.veh / D.CAP_V[v]; }

    const rows = [];
    const R = (i,a,sense,b) => rows.push({ i, a, sense, b });
    for (let p = 0; p < nP; p++) for (let d = 0; d < nD; d++) {
      const I = [], A = [];
      for (let v = 0; v < nV; v++) for (let z = 0; z < nMode; z++) { I.push(i3(p,v,d,z)); A.push(1); }
      R(I, A, '=', D.DEMAND[p][d]);
    }
    for (let k = 0; k < nK; k++) for (let v = 0; v < nV; v++) {
      const I = [], A = [];
      for (let b = 0; b < nB; b++) for (let z = 0; z < nMode; z++) { I.push(i2(k,b,v,z)); A.push(1); }
      for (let p = 0; p < nP; p++) if (D.PROD[p].kwh === D.CAPS[k])
        for (let d = 0; d < nD; d++) for (let z = 0; z < nMode; z++) { I.push(i3(p,v,d,z)); A.push(-1); }
      R(I, A, '=', 0);
    }
    for (let m = 0; m < nM; m++) for (let b = 0; b < nB; b++) {
      const I = [], A = [];
      for (let s = 0; s < nS; s++) for (let z = 0; z < nMode; z++) { I.push(i1(m,s,b,z)); A.push(1); }
      for (let k = 0; k < nK; k++) { const f = D.BOM[D.CAPS[k]][m]; if (!f) continue;
        for (let v = 0; v < nV; v++) for (let z = 0; z < nMode; z++) { I.push(i2(k,b,v,z)); A.push(-f); } }
      R(I, A, '=', 0);
    }
    for (let s = 0; s < nS; s++) { const I = [], A = [];
      for (let m = 0; m < nM; m++) for (let b = 0; b < nB; b++) for (let z = 0; z < nMode; z++) { I.push(i1(m,s,b,z)); A.push(1); }
      I.push(iys(s)); A.push(-1); R(I, A, '<=', 0); }
    for (let b = 0; b < nB; b++) { const I = [], A = [];
      for (let k = 0; k < nK; k++) for (let v = 0; v < nV; v++) for (let z = 0; z < nMode; z++) { I.push(i2(k,b,v,z)); A.push(1); }
      I.push(iyb(b)); A.push(-1); R(I, A, '<=', 0); }
    for (let v = 0; v < nV; v++) { const I = [], A = [];
      for (let p = 0; p < nP; p++) for (let d = 0; d < nD; d++) for (let z = 0; z < nMode; z++) { I.push(i3(p,v,d,z)); A.push(1); }
      I.push(iyv(v)); A.push(-1); R(I, A, '<=', 0); }
    const yIdx = []; for (let j = OY; j < n; j++) { yIdx.push(j); R([j], [1], '<=', yCap[j - OY]); }

    if (o.epsCO2 != null) {          // eps-Constraint: CO2 <= eps  [t CO2e]
      const I = [], A = [];
      for (let j = 0; j < OY; j++) if (emi[j]) { I.push(j); A.push(emi[j] / 1000); }
      R(I, A, '<=', o.epsCO2);
    }
    if (o.epsCost != null) {         // eps-Constraint: Kosten <= eps
      const I = [], A = [];
      for (let j = 0; j < n; j++) if (cost[j]) { I.push(j); A.push(cost[j]); }
      R(I, A, '<=', o.epsCost);
    }
    return { rows, cost, emi, n, yIdx, yCap, optMode, nMode, idx:{ i1,i2,i3,iys,iyb,iyv,OY } };
  }

  // ------------------------------------------------------------------
  //  Branch & Bound ueber die Standortvariablen
  // ------------------------------------------------------------------
  function milp(M, c, o) {
    o = o || {};
    const lim = o.nodeLimit || 4000;
    let best = null, bestZ = Infinity, nodes = 0;
    const stack = [{ fix:{} }];
    while (stack.length) {
      if (++nodes > lim) break;
      const nd = stack.pop();
      const rows = M.rows.slice();
      for (const j in nd.fix) rows.push({ i:[+j], a:[1], sense:'=', b:nd.fix[j] });
      const r = simplex(rows, c, M.n, o);
      if (r.status !== 'optimal') continue;
      if (r.z > bestZ - 1e-6) continue;
      let bj = -1, bf = 1e-6, bcap = 0;
      for (let t = 0; t < M.yIdx.length; t++) {
        const j = M.yIdx[t], cap = M.yCap[t], v = r.x[j] / cap;
        const f = Math.min(v, 1 - v);
        if (f > bf) { bf = f; bj = j; bcap = cap; }
      }
      if (bj < 0) { best = r; bestZ = r.z; continue; }
      const up = Object.assign({}, nd.fix); up[bj] = bcap;   // Standort geoeffnet
      const dn = Object.assign({}, nd.fix); dn[bj] = 0;      // Standort geschlossen
      stack.push({ fix:dn }, { fix:up });
    }
    return best ? { status:'optimal', x:best.x, z:bestZ, nodes } : { status:'infeasible', nodes };
  }

  // Loesungsvektor -> Flussobjekt fuer den Bewertungskern
  function toFlows(M, x) {
    const F = C.emptyFlows();
    for (let m = 0; m < nM; m++) for (let s = 0; s < nS; s++) for (let b = 0; b < nB; b++)
      F.x1[m][s][b] = x[M.idx.i1(m,s,b,0)];
    for (let k = 0; k < nK; k++) for (let b = 0; b < nB; b++) for (let v = 0; v < nV; v++)
      F.x2[k][b][v] = x[M.idx.i2(k,b,v,0)];
    for (let p = 0; p < nP; p++) for (let v = 0; v < nV; v++) for (let d = 0; d < nD; d++)
      F.x3[p][v][d] = x[M.idx.i3(p,v,d,0)];
    return F;
  }

  // ------------------------------------------------------------------
  //  Oeffentliche Aufrufe
  // ------------------------------------------------------------------
  function optimize(o) {                       // o.objective: 'cost' | 'co2'
    o = o || {};
    const M = build(o);
    const c = o.objective === 'co2'
      ? Float64Array.from(M.emi, v => v / 1000)   // t CO2e
      : M.cost;
    const r = milp(M, c, o);
    if (r.status !== 'optimal') return { status:r.status };
    return { status:'optimal', flows:toFlows(M, r.x), z:r.z, nodes:r.nodes, M };
  }

  return { optimize, build, milp, simplex, toFlows };
})();

   abgelegt hat. Danach: kostenminimales Netz unter einer frei
   waehlbaren CO2-Obergrenze (eps-Constraint) sowie Szenario fuer
   LG-Chem-Preis und SK-Kapazitaet (Fragen 3 und 4).
   Ein CO2-Optimum-Knopf fehlt bewusst: Die Studierenden finden das
   emissionsminimale Netz, indem sie die Grenze senken, bis keine
   zulaessige Loesung mehr existiert.
   Jeder Lauf merkt sich sein Szenario; Laeufe verschiedener Szenarien
   erscheinen im Diagramm in verschiedenen Farben. Die Laeufe lassen

// gerechnet wurden.

function runLabel(r) {
  return T('sRun') + ' ' + r.no + ' · ' + (r.eps == null ? T('sNoLimit') : '≤ ' + I.nf(r.eps / 1e6, 3) + ' Mt') +
         ' · ' + V.scenLabel(r.scen);

  list.forEach(r => {
    let g = out.find(x => sameScen(x.scen, r.scen));
    if (!g) { g = { scen:r.scen, runs:[] }; out.push(g); }

}

  const ok = runs.filter(r => r.ok);
  const groups = scenGroups(ok);
  const multi = groups.length > 1 || (groups[0] && !sameScen(groups[0].scen, { lgFactor:1, skFactor:1 }));
  const pts = ok.map(r => ({ k:'par', c:r.c, e:r.e, ok:true, col:V.scenColor(r.scen),
    n:T('sRun') + ' ' + r.no + (multi ? ' · ' + V.scenLabel(r.scen) : ''), nolabel:multi, prio:1.5,
    click:() => showRun(r) }));
  const lines = groups.map(g => ({ col:V.scenColor(g.scen),
    pts:g.runs.slice().sort((a, b) => a.c - b.c).map(r => ({ c:r.c, e:r.e })) }));
  const legend = multi ? groups.map(g => ({ col:V.scenColor(g.scen), label:V.scenLabel(g.scen) })) : [];

    if (v != null && !(v > 0)) { info.textContent = T('sBadEps'); return; }
    btn.disabled = true; info.textContent = T('running');
    setTimeout(() => {
      const r = solve(v);

  w.appendChild(el('div', { class:'row' }, [
    el('label', { class:'note', style:'display:flex;gap:6px;align-items:center' },
      [ el('span', { text:T('sEps') }), eps, el('span', { text:'Mt CO₂e' }) ]), btn ]));
  w.appendChild(el('div', { class:'note', style:'margin-top:6px', text:T('sScenNow') + ': ' + V.scenLabel(A.scen) }));
  w.appendChild(info);

  if (runs.length) {
    const tb = el('table');
    tb.appendChild(el('thead', {}, [ el('tr', {}, [ el('th', { text:'#' }), el('th', { text:T('pScen') }),
      el('th', { text:T('sEps') }), el('th', { text:T('totalCost') }), el('th', { text:T('co2') }), el('th', { text:'' }) ]) ]));
    const tbody = el('tbody');
    runs.forEach(r => {
      const lim = r.eps == null ? T('sNoLimit') : '≤ ' + I.mt(r.eps);
      const sc = el('td', { style:'white-space:nowrap' }, [
        el('span', { style:'display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:' + V.scenColor(r.scen) }),
        el('span', { text:V.scenLabel(r.scen) }) ]);

      b.addEventListener('click', () => showRun(r));

  }
  return w;
}

    +r.scen.lgFactor.toFixed(6), +r.scen.skFactor, r.eps == null ? null : Math.round(r.eps),

    el('div', { class:'row', style:'margin-bottom:8px' }, [ name, btn ]), out ]);

// ---------- Einhaengen -------------------------------------------------
function panels(left, right, rr) {
  V = window.VWAPP;
  A = V.APP; el = V.el; card = V.card; rerender = rr;
  if (!unlocked && A.snaps.length && feasibleSnap()) setUnlocked();
  if (!unlocked) { left.appendChild(card('sOptT', panelLocked(), { badge:'🔒' })); return; }
  V.chartSource(chartPoints);

// ---------- Zustand ---------------------------------------------------

           S.splitBat.length === nK && S.splitBat.every(r => r.length === nV) &&

const OFF = { s:[0,0], b:[-7,-7], v:[0,0], d:[9,9] };
function nodeXY(kind, i) {

function renderMap(res, F) {

        stroke:'var(--bad)', 'stroke-width':0.8, 'stroke-dasharray':'1.4 1.4' }));
    const cc = cities[name] || (cities[name] = { x:0, y:0, n:0, over:false });
    cc.x += x; cc.y += y; cc.n++; cc.over = cc.over || over;
  };
  D.SUP.forEach((a,i) => drawNode('s',i,a.city,res.open.sup[i],res.util.sup[i]));
  D.BAP.forEach((a,i) => drawNode('b',i,a.city,res.open.bap[i],res.util.bap[i]));
  D.VEH.forEach((a,i) => drawNode('v',i,a.city,res.open.veh[i],res.util.veh[i]));
  D.DC .forEach((a,i) => drawNode('d',i,a.city,1,null));

  const boxes = [];
  const hit = b => boxes.some(o => !(b.x2 < o.x1 || b.x1 > o.x2 || b.y2 < o.y1 || b.y1 > o.y2));
  const CAND = [[6,1.6,'start'],[-6,1.6,'end'],[0,-6,'middle'],[0,8,'middle'],
                [6,-5,'start'],[-6,-5,'end'],[6,8,'start'],[-6,8,'end']];
  Object.keys(cities).forEach(name => {
    const c = cities[name], cx = c.x/c.n, cy = c.y/c.n;
    const w = name.length * 2.55, h = 5.6;
    let put = null;
    for (const [dx,dy,anc] of CAND) {
      const x = cx + dx, y = cy + dy;
      const x1 = anc === 'start' ? x : anc === 'end' ? x - w : x - w/2;
      const bx = { x1, x2:x1 + w, y1:y - h*0.78, y2:y + h*0.22 };
      if (!hit(bx)) { put = { x, y, anc, b:bx }; break; }
    }
    if (!put) { const x = cx + 6, y = cy + 1.6;
      put = { x, y, anc:'start', b:{ x1:x, x2:x+w, y1:y-4.4, y2:y+1.2 } }; }
    boxes.push(put.b);
    gLab.appendChild(el('@text', { x:put.x, y:put.y, 'font-size':'5.2', 'text-anchor':put.anc,
      fill:c.over ? 'var(--bad)' : 'var(--ink)', 'font-weight':'600',
      stroke:'var(--panel)', 'stroke-width':'1.5', 'paint-order':'stroke', text:name }));
  });
  return svg;
}

// Zahleneingabe. Reagiert auf 'input' (also auch auf die Pfeiltasten und die
// Spinner-Pfeile) und schreibt sofort in den Zustand; neu gezeichnet werden
// nur die Ergebnisansichten, das Feld selbst behaelt Fokus und Cursor.
function numInput(val, onch, o) {
  o = o || {};
  const i = el('input', { class:'num', type:'number', value:val,
                          min:0, max:o.max, step:o.step || 1, 'data-k':o.k, title:o.title });
  const fire = () => { if (i.value !== '') onch(Math.max(0, Math.min(o.max != null ? o.max : 1e9, +i.value || 0))); };
  i.addEventListener('input', fire);
  i.addEventListener('blur', () => { if (i.value === '') { i.value = 0; fire(); } });
  return i;
}
function barList(items, total, unit) {

      ]),

// Zu einem Problem springen und es kurz hervorheben
function jump(keys) {
  if (!keys || !keys.length) return;
  const tab = keys[0].split('-')[0];
  if (tab !== APP.tab) setTab(tab);
  const nodes = keys.map(k => document.querySelector('[data-k="' + k + '"]')).filter(Boolean);
  if (!nodes.length) return;
  const host = nodes[0].closest('.card') || nodes[0];
  host.scrollIntoView({ behavior:'smooth', block:'center' });
  nodes.forEach(n => { n.classList.remove('flash'); void n.offsetWidth; n.classList.add('flash');
                       setTimeout(() => n.classList.remove('flash'), 2200); });
  try { nodes[0].focus({ preventScroll:true }); } catch (e) {}
}

function problems(res) {
  const items = [];
  DEC.decisionIssues(APP.S).forEach(i => {
    if (i.t === 'noPlant') {
      const keys = [];
      for (let p = 0; p < nP; p++) for (let d = 0; d < nD; d++)
        if (!(APP.S.routeVeh[p][d] >= 0) && D.PROD[p].name + ' → ' + D.DC[d].city === i.name)
          keys.push('veh-' + p + '-' + d);
      items.push({ kind:'noPlant', stage:'veh', txt:i.name, keys });
    } else if (i.t === 'noSup') {
      const keys = [];
      for (let m = 0; m < nM; m++) for (let b = 0; b < nB; b++)
        if (D.MOD[m].name + ' → ' + D.BAP[b].city === i.name)
          for (let s = 0; s < nS; s++) keys.push('proc-' + m + '-' + b + '-' + s);
      items.push({ kind:'noSup', stage:'proc', txt:modName(i.name), keys });
    }
  });
  res.feas.issues.forEach(i => {
    if (i.t.slice(0,3) !== 'cap') return;
    const txt = i.name + ': ' + I.nf(i.use) + ' / ' + I.nf(i.cap) + '  (' + I.pc(i.use/i.cap,0) + ')';
    const keys = [];
    let stage = 'veh';
    if (i.t === 'capSup') {
      stage = 'proc';
      for (let m = 0; m < nM; m++) for (let b = 0; b < nB; b++)
        if (APP.S.supShare[m][b][i.i] > 0) keys.push('proc-' + m + '-' + b + '-' + i.i);
    } else if (i.t === 'capBap') {
      stage = 'bat';
      for (let k = 0; k < nK; k++) for (let v = 0; v < nV; v++) {
        const bs = DEC.clamp(APP.S.splitBat[k][v]);
        if ((i.i === 0 && bs > 0) || (i.i === 1 && bs < 100)) keys.push('bat-' + k + '-' + v);
      }
    } else if (i.t === 'capVeh') {
      for (let p = 0; p < nP; p++) for (let d = 0; d < nD; d++)
        if (APP.S.routeVeh[p][d] === i.i) keys.push('veh-' + p + '-' + d);
    }
    items.push({ kind:'cap', stage, txt, keys });
  });
  return items;
}

  const w = el('div');

  const msg = { noPlant:['Keinem Werk zugeordnet','No plant assigned'],

// ---------- Vergleichsplan ---------------------------------------------
// Auswahl, gegen welchen Plan die Kennzahlen verglichen werden:
// Ausgangsplanung, Speicherpunkte, eigene Optimierungslaeufe
// (Studierende) bzw. Optima und Gruppenergebnisse (Lehrende).
function compareOptions() {
  const o = [{ id:'plan', label:T('plan'), get:() => evalS(DEC.basePlan()) }];
  APP.snaps.forEach(s => o.push({ id:'snap:' + s.id, label:T('cmpSnap') + ': ' + s.name, get:() => evalS(s.S) }));
  if (window.VWSTUD) window.VWSTUD.runs.filter(r => r.ok).forEach(r => o.push({ id:'run:' + r.no,
    label:T('sRun') + ' ' + r.no + ' · ' + (r.eps == null ? T('sNoLimit') : '≤ ' + I.mt(r.eps)) + ' · ' + scenLabel(r.scen),
    get:() => C.evaluate(r.F, r.scen) }));
  if (TEACH && window.VWTEACH && window.VWTEACH.compareItems) window.VWTEACH.compareItems().forEach(x => o.push(x));
  else if (TEACH) {
    if (APP.opt.cost) o.push({ id:'opt:cost', label:T('optCost'), get:() => C.evaluate(APP.opt.cost.flows, APP.scen) });
    if (APP.opt.co2)  o.push({ id:'opt:co2',  label:T('optCO2'),  get:() => C.evaluate(APP.opt.co2.flows,  APP.scen) });
    (APP.pareto || []).forEach((q, i) => o.push({ id:'par:' + i, label:T('optPareto') + ' #' + (i + 1), get:() => C.evaluate(q.F, APP.scen) }));
    APP.groups.forEach((g, i) => o.push({ id:'grp:' + i, label:T('group') + ': ' + g.name, get:() => evalS(g.S) }));
  }
  return o;
}
function compareTarget() {
  const opts = compareOptions();
  let c = opts.find(x => x.id === APP.cmpId);
  if (!c) { c = opts[0]; APP.cmpId = 'plan'; }
  return { opts, c, res:c.get() };
}
function compareSelect(opts) {
  const sel = el('select', { class:'pick', style:'width:auto;flex:1;min-width:220px;max-width:100%' });
  opts.forEach(x => sel.appendChild(el('option', { value:x.id, text:x.label, selected:x.id === APP.cmpId })));
  sel.addEventListener('change', () => { APP.cmpId = sel.value; refresh(); });
  return el('label', { class:'note cmpsel', style:'display:flex;gap:8px;align-items:center;padding:10px 14px 0;flex-wrap:wrap' },
    [ el('span', { text:T('cmpWith') + ':' }), sel ]);
}

function kpiCards(res) {
  const wrap = el('div');
  const cmp = compareTarget();
  wrap.appendChild(compareSelect(cmp.opts));
  const w = el('div', { class:'kpis' });
  wrap.appendChild(w);
  const add = (lab, val, delta, big) => {
    const k = el('div', { class:'kpi' + (big ? ' big' : '') }, [ el('div', { class:'lab', html:lab }) ]);
    k.appendChild(el('div', { class:'val', text:val }));
    const s = el('div', { class:'sub' });
    if (delta != null) {
      const z = Math.abs(delta) < 5e-5;
      s.appendChild(el('span', { class:'delta ' + (z ? '' : delta > 0 ? 'up' : 'dn'),
        text:(delta > 0 && !z ? '+' : '') + I.pc(delta,1) + ' ' }));
    }
    if (big) s.appendChild(el('span', { text:T('vsCmp') + ' ' + (cmp.c.id === 'plan' ? T('plan') : cmp.c.label) }));
    k.appendChild(s); w.appendChild(k);
  };
  const c = res.cost, b = cmp.res.cost;
  add(T('totalCost'), I.bn(c.total), c.total/b.total - 1, true);
  add(T('co2'), I.mt(res.co2.total), res.co2.total/cmp.res.co2.total - 1, true);
  add(T('procure'),   I.bn(c.procure), c.procure/b.procure - 1);
  add(T('assemblyK'), I.bn(c.assembly + c.production),
      (c.assembly + c.production)/(b.assembly + b.production) - 1);
  add(T('transport'), I.mio(c.transport, '€'), c.transport/b.transport - 1);
  return wrap;
}
function deltaItem(w, lab, d, fmt) {
  w.appendChild(el('span', { class:'di' }, [
    el('span', { class:'note', text:lab + ' ' }),
    el('b', { class:'delta ' + (d > 0 ? 'up' : 'dn'), text:(d > 0 ? '+' : '−') + fmt(Math.abs(d)) })
  ]));
}
function changeStrip(res) {
  const L = APP.beforeKPI;
  const box = el('div', { class:'strip' });
  const w = el('div', { class:'srow' });
  w.appendChild(el('b', { class:'slab', text:T('lastChange') + ':' }));
  if (!L) w.appendChild(el('span', { class:'note', text:T('noChange') }));
  else if (Math.abs(res.cost.total - L.c) < 0.5 && Math.abs(res.co2.total - L.e) < 0.001)
    w.appendChild(el('span', { class:'note', text:T('noEffect') }));
  else {
    deltaItem(w, T('totalCost'), res.cost.total - L.c, v => I.mio(v, '€'));
    deltaItem(w, T('co2'), res.co2.total - L.e, v => I.nf(v) + ' t');
    const di = res.feas.issues.length - L.i;
    if (di) deltaItem(w, T('issues'), di, v => I.nf(v));
  }
  box.appendChild(w);
  const sp = snapById(APP.loaded);
  if (sp && !APP.override && APP.cmpId !== 'snap:' + sp.id) {
    const r = evalS(sp.S);
    const w2 = el('div', { class:'srow' });
    w2.appendChild(el('b', { class:'slab', text:T('vsSnap') + (I.cur() ? ' “' + sp.name + '”:' : ' „' + sp.name + '“:') }));
    const dc = res.cost.total - r.cost.total, de = res.co2.total - r.co2.total;
    if (Math.abs(dc) < 0.5 && Math.abs(de) < 0.001) w2.appendChild(el('span', { class:'note', text:'±0' }));
    else { deltaItem(w2, T('totalCost'), dc, v => I.mio(v, '€')); deltaItem(w2, T('co2'), de, v => I.nf(v) + ' t'); }
    box.appendChild(w2);
  }
  return box;
}

// =====================================================================
//  Kosten-CO2-Diagramm
//  Zulaessige Plaene: ausgefuellt. Unzulaessige: hohler Kreis mit rotem
//  Kreuz und grauer Beschriftung — sie sind nicht umsetzbar und duerfen
//  nicht wie echte Alternativen aussehen.
// =====================================================================
const KIND = {
  cur:  { col:'var(--acc2)', r:6.5, shape:'circle' },
  plan: { col:'var(--mut)',  r:5,   shape:'circle' },
  snap: { col:'var(--s3)',   r:5.5, shape:'square' },
  par:  { col:'var(--acc)',  r:4,   shape:'circle' },
  grp:  { col:'var(--warn)', r:6,   shape:'diamond' },
  grun: { col:'var(--warn)', r:4.2, shape:'diamond' }
};

// ---------- Szenarien: Farbe und Bezeichnung ------------------------------
// Basisszenario in der Akzentfarbe, weitere Szenarien in der Reihenfolge
// ihres ersten Auftretens in dieser Sitzung.
const SCEN_PAL = ['#e07a1f','#2a9d8f','#c0397b','#8f7a12','#5b6bd6','#7f4f24'];
const SCEN_SEEN = [];
const scenKey = sc => (+(sc.lgFactor || 1)).toFixed(5) + '|' + (+(sc.skFactor || 1));
const isBaseScen = sc => scenKey(sc) === scenKey({ lgFactor:1, skFactor:1 });
function scenColor(sc) {
  if (isBaseScen(sc)) return 'var(--acc)';
  const k = scenKey(sc);
  let i = SCEN_SEEN.indexOf(k); if (i < 0) { SCEN_SEEN.push(k); i = SCEN_SEEN.length - 1; }
  return SCEN_PAL[i % SCEN_PAL.length];
}
function scenLabel(sc) {
  if (isBaseScen(sc)) return T('scenBase');
  const out = [], lg = (sc.lgFactor || 1) - 1, sk = sc.skFactor || 1;
  if (Math.abs(lg) > 1e-9) out.push('LG ' + (lg > 0 ? '+' : '−') + I.nf(Math.abs(lg) * 100, Math.abs(lg * 100 - Math.round(lg * 100)) > 1e-9 ? 2 : 0) + ' %');
  if (sk !== 1) out.push('SK ×' + I.nf(sk, sk % 1 ? 1 : 0));
  return out.join(' · ');
}
function marker(g, kind, x, y, ok, extra) {
  const K = KIND[kind], r = K.r, col = (extra && extra.col) || K.col;
  const fill = ok ? col : 'var(--panel)';
  const sw = ok ? 1.3 : 1.6, stroke = ok ? 'var(--panel)' : col;
  let n;
  if (K.shape === 'square') n = el('@rect', { x:x-r, y:y-r, width:2*r, height:2*r, rx:1.5, fill, stroke, 'stroke-width':sw });
  else if (K.shape === 'diamond') n = el('@rect', { x:x-r/1.3, y:y-r/1.3, width:r*1.54, height:r*1.54, fill, stroke,
      'stroke-width':sw, transform:`rotate(45 ${x} ${y})` });
  else n = el('@circle', { cx:x, cy:y, r, fill, stroke, 'stroke-width':sw });
  g.appendChild(n);
  if (!ok) {
    const q = r * 0.62;
    g.appendChild(el('@path', { d:`M${x-q},${y-q}L${x+q},${y+q}M${x+q},${y-q}L${x-q},${y+q}`,
      stroke:'var(--bad)', 'stroke-width':1.7, 'stroke-linecap':'round' }));
  }
  if (extra && extra.ring) g.appendChild(el('@circle', { cx:x, cy:y, r:r+3.2, fill:'none', stroke:col,
      'stroke-width':1.1, 'stroke-dasharray':'2 1.6' }));
}
function niceTicks(a, b, n) {
  const raw = (b - a) / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
  const out = []; for (let v = Math.ceil(a / step) * step; v <= b + step*1e-9; v += step) out.push(v);
  return { out, dec: Math.max(0, -Math.floor(Math.log10(step))) };
}
function costCo2Chart() {
  const pts = [];
  const cur = APP.res;
  const base = TEACH ? evalS(DEC.basePlan()) : APP.base;
  const tip = (n, r) => n + '\n' + I.bn(r.c) + ' · ' + I.mt(r.e) + '\n' + (r.ok ? T('legFeas') : T('legInfeas'));
  pts.push({ k:'plan', c:base.cost.total, e:base.co2.total, ok:base.feas.ok, n:T('plan'), prio:1 });
  APP.snaps.forEach(s => {
    const r = evalS(s.S);
    pts.push({ k:'snap', c:r.cost.total, e:r.co2.total, ok:r.feas.ok, n:s.name, prio:2,
               ring:s.id === APP.loaded, click:() => loadSnap(s.id) });
  });
  const lines = [];
  const legend = [];
  UI.chartSources.forEach(f => { const o = f() || {}; (o.pts || []).forEach(p => pts.push(p));
    if (o.line) lines.push(o.line); (o.lines || []).forEach(L => lines.push(L));
    (o.legend || []).forEach(l => { if (!legend.some(x => x.label === l.label)) legend.push(l); }); });
  const curN = APP.override ? APP.override.label : T('current');
  pts.push({ k:'cur', c:cur.cost.total, e:cur.co2.total, ok:cur.feas.ok, n:curN, prio:3 });

  const W = 560, H = 330, m = { l:58, r:18, t:14, b:42 };
  const xs = pts.map(p => p.c), ys = pts.map(p => p.e);
  const pad = (a, b, rel) => { const d = (b - a) || Math.abs(a) * rel; return [a - d*0.14, b + d*0.14]; };
  const [x0,x1] = pad(Math.min(...xs), Math.max(...xs), 0.01);
  const [y0,y1] = pad(Math.min(...ys), Math.max(...ys), 0.004);
  const X = v => m.l + (v - x0)/(x1 - x0)*(W - m.l - m.r);
  const Y = v => H - m.b - (v - y0)/(y1 - y0)*(H - m.t - m.b);
  const svg = el('@svg', { viewBox:`0 0 ${W} ${H}`, class:'chart' });
  const g = () => { const n = el('@g'); svg.appendChild(n); return n; };
  const gg = g(), gl = g(), gp = g(), gt = g();

  const tx = niceTicks(x0/1e9, x1/1e9, 5), ty = niceTicks(y0/1e6, y1/1e6, 5);
  tx.out.forEach(v => { const x = X(v*1e9);
    gg.appendChild(el('@line', { y1:m.t, y2:H-m.b, x1:x, x2:x, stroke:'var(--line)', 'stroke-width':1 }));
    gg.appendChild(el('@text', { y:H-m.b+15, x, 'text-anchor':'middle', 'font-size':10, fill:'var(--mut)', text:I.nf(v, tx.dec) })); });
  ty.out.forEach(v => { const y = Y(v*1e6);
    gg.appendChild(el('@line', { x1:m.l, x2:W-m.r, y1:y, y2:y, stroke:'var(--line)', 'stroke-width':1 }));
    gg.appendChild(el('@text', { x:m.l-7, y:y+3.5, 'text-anchor':'end', 'font-size':10, fill:'var(--mut)', text:I.nf(v, ty.dec) })); });
  gg.appendChild(el('@text', { x:(m.l+W-m.r)/2, y:H-6, 'text-anchor':'middle', 'font-size':11,
    fill:'var(--mut)', text:(I.cur() ? 'Total cost [bn €]' : 'Gesamtkosten [Mrd. €]') }));
  gg.appendChild(el('@text', { x:13, y:(m.t+H-m.b)/2, 'font-size':11, fill:'var(--mut)',
    transform:`rotate(-90 13 ${(m.t+H-m.b)/2})`, 'text-anchor':'middle',
    text:(I.cur() ? 'Emissions [Mt CO₂e]' : 'Emissionen [Mt CO₂e]') }));
  lines.forEach(L => { const P = Array.isArray(L) ? L : L.pts; if (P.length > 1) gl.appendChild(el('@path', {
    d:P.map((p,i) => (i ? 'L' : 'M') + X(p.c) + ',' + Y(p.e)).join(' '), fill:'none', stroke:L.col || 'var(--acc)',
    'stroke-width':L.w || 2, 'stroke-opacity':.85, 'stroke-dasharray':'5 3' })); });

  // Punkte: zuerst niedrige Prioritaet, damit der aktuelle Plan oben liegt
  const order = pts.slice().sort((a, b) => (a.prio||0) - (b.prio||0));
  order.forEach(p => {
    const x = X(p.c), y = Y(p.e);
    const grp = el('@g', { class:p.click ? 'pt click' : 'pt' });
    grp.appendChild(el('@title', { text:tip(p.n || '', p) }));
    marker(grp, p.k, x, y, p.ok, { ring:p.ring || p.k === 'cur', col:p.col });
    if (p.click) grp.addEventListener('click', p.click);
    gp.appendChild(grp);
  });

  // Beschriftungen ohne Ueberlappung: hoechste Prioritaet zuerst
  const boxes = pts.map(p => { const r = KIND[p.k].r + 2; return { x1:X(p.c)-r, x2:X(p.c)+r, y1:Y(p.e)-r, y2:Y(p.e)+r }; });
  const hit = b => b.x1 < m.l || b.x2 > W - m.r || b.y1 < m.t || b.y2 > H - m.b ||
    boxes.some(o => !(b.x2 < o.x1 || b.x1 > o.x2 || b.y2 < o.y1 || b.y1 > o.y2));
  pts.slice().sort((a, b) => (b.prio||0) - (a.prio||0)).forEach(p => {
    if (!p.n || p.nolabel) return;
    const x = X(p.c), y = Y(p.e), r = KIND[p.k].r + 4, w = p.n.length * 5.6 + 2, h = 11;
    const CAND = [[r,3.5,'start'],[-r,3.5,'end'],[0,-r-1,'middle'],[0,r+9,'middle'],
                  [r,-r,'start'],[-r,-r,'end'],[r,r+6,'start'],[-r,r+6,'end']];
    for (const [dx,dy,anc] of CAND) {
      const lx = x + dx, ly = y + dy;
      const bx1 = anc === 'start' ? lx : anc === 'end' ? lx - w : lx - w/2;
      const b = { x1:bx1, x2:bx1 + w, y1:ly - h*0.8, y2:ly + h*0.2 };
      if (hit(b)) continue;
      boxes.push(b);
      gt.appendChild(el('@text', { x:lx, y:ly, 'font-size':10.5, 'text-anchor':anc,
        fill:p.ok ? 'var(--ink)' : 'var(--mut)', 'font-style':p.ok ? 'normal' : 'italic',
        'font-weight':p.k === 'cur' ? 650 : 450,
        stroke:'var(--panel)', 'stroke-width':3, 'paint-order':'stroke', text:p.n }));
      return;
    }
  });
  if (!legend.length) return svg;
  const lg = el('div', { class:'leg', style:'padding:2px 0 6px;border:0' }, [ el('span', { class:'note', text:T('scenLeg') + ':' }) ]);
  legend.forEach(l => lg.appendChild(el('span', {}, [
    el('span', { style:'display:inline-block;width:11px;height:11px;border-radius:50%;background:' + l.col }),
    el('span', { text:l.label }) ])));
  return el('div', {}, [ svg, lg ]);
}
function chartLegend() {
  const item = (kind, ok, lab) => {
    const s = el('@svg', { viewBox:'-9 -9 18 18', width:16, height:16 });
    marker(s, kind, 0, 0, ok);
    return el('span', {}, [ s, el('span', { text:lab }) ]);
  };
  const kinds = [ item('cur', true, T('current')), item('plan', true, T('plan')), item('snap', true, T('pSnaps')) ];
  if (TEACH) kinds.push(item('par', true, T('optPoint')), item('grp', true, T('pImport')));
  else if (window.VWSTUD && window.VWSTUD.runs.some(r => r.ok)) kinds.push(item('par', true, T('sRuns')));
  if (TEACH && APP.groupRuns && APP.groupRuns.length) kinds.push(item('grun', true, T('gRuns')));
  return el('div', { class:'leg' }, [ ...kinds, el('span', { class:'sep' }),
    item('plan', true, T('legFeas')), item('plan', false, T('legInfeas')) ]);
}

function loadSnap(id) {
  const s = snapById(id); if (!s) return;
  APP.S = cloneS(s.S); APP.loaded = id; APP.beforeKPI = null; APP.override = null;
  render();
}
function panelSnapsStatic() {
  const name = el('input', { class:'txt', type:'text', placeholder:T('snapName'), maxlength:40 });
  const btn = el('button', { class:'btn', type:'button', text:'＋ ' + T('snapSave') });
  const save = () => {
    if (APP.override) return;
    const nm = name.value.trim() || (T('snapDef') + ' ' + (APP.snaps.length + 1));
    const id = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    APP.snaps.push({ id, name:nm, t:Date.now(), S:cloneS(APP.S) });
    APP.loaded = id; name.value = '';
    saveSnaps(); refresh();
  };
  btn.addEventListener('click', save);
  name.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
  UI.hooks.push(() => { btn.disabled = !!APP.override; btn.title = APP.override ? T('snapOverride') : ''; });
  return el('div', {}, [ el('p', { class:'note', style:'margin-top:0', text:T('pSnapsH') }),
    el('div', { class:'row' }, [ name, btn ]) ]);
}
function snapList() {
  const w = el('div');
  if (!APP.snaps.length) { w.appendChild(el('p', { class:'note', style:'margin:10px 0 0', text:T('snapNone') })); return w; }
  const ev = APP.snaps.map(s => ({ s, r:evalS(s.S) }));
  const feas = ev.filter(o => o.r.feas.ok);
  const bestC = feas.length ? feas.reduce((a, b) => b.r.cost.total < a.r.cost.total ? b : a).s.id : null;
  const bestE = feas.length ? feas.reduce((a, b) => b.r.co2.total < a.r.co2.total ? b : a).s.id : null;
  const tb = el('table', { class:'snaps' });
  tb.appendChild(el('thead', {}, [ el('tr', {}, [ el('th', { text:T('snapName') }),
    el('th', { text:T('totalCost') }), el('th', { text:'CO₂' }), el('th', { text:T('status') }), el('th', { text:'' }) ]) ]));
  const tbody = el('tbody');
  ev.forEach(({ s, r }) => {
    const active = s.id === APP.loaded;
    const nm = el('input', { class:'txt flat', type:'text', value:s.name, maxlength:40, title:T('snapName') });
    nm.addEventListener('change', () => { s.name = nm.value.trim() || s.name; saveSnaps(); refresh(); });
    const tags = el('div', { class:'tags' });
    if (active) tags.appendChild(el('span', { class:'tag on', text:T('snapActive') + (sameS(APP.S, s.S) ? '' : ' · ' + T('snapMod')) }));
    if (s.id === bestC) tags.appendChild(el('span', { class:'tag good', text:'★ ' + T('snapBestC') }));
    if (s.id === bestE) tags.appendChild(el('span', { class:'tag good', text:'★ ' + T('snapBestE') }));
    const ld = el('button', { class:'btn ghost mini', type:'button', text:T('snapLoad'), title:T('snapLoadH') });
    ld.addEventListener('click', () => loadSnap(s.id));
    const ow = el('button', { class:'btn ghost mini', type:'button', text:'↻', title:T('snapOverH') });
    ow.disabled = !!APP.override;
    ow.addEventListener('click', () => { s.S = cloneS(APP.S); s.t = Date.now(); APP.loaded = s.id; saveSnaps(); refresh(); });
    const del = el('button', { class:'btn ghost mini danger', type:'button', text:'✕', title:T('snapDel') });
    del.addEventListener('click', () => {
      if (!del.classList.contains('armed')) {
        del.classList.add('armed'); del.textContent = T('snapDelQ');
        setTimeout(() => { if (del.isConnected) { del.classList.remove('armed'); del.textContent = '✕'; } }, 3000);
        return;
      }
      APP.snaps = APP.snaps.filter(x => x.id !== s.id);
      if (APP.loaded === s.id) APP.loaded = null;
      saveSnaps(); refresh();
    });
    tbody.appendChild(el('tr', { class:active ? 'active' : '' }, [
      el('td', {}, [ nm, tags ]),
      el('td', { class:'mono', text:I.bn(r.cost.total) }),
      el('td', { class:'mono', text:I.mt(r.co2.total) }),
      el('td', { class:r.feas.ok ? 'okc' : 'badc', text:r.feas.ok ? '✓ ' + T('legFeas') : '✗ ' + T('legInfeas') }),
      el('td', { class:'acts' }, [ ld, ow, del ])
    ]));
  });
  tb.appendChild(tbody);
  w.appendChild(el('div', { class:'scroll', style:'margin-top:12px' }, [tb]));
  return w;
}

// =====================================================================
//  Aktualisierung
// =====================================================================
function change(fn) {
  if (APP.res) APP.beforeKPI = { c:APP.res.cost.total, e:APP.res.co2.total, i:APP.res.feas.issues.length };
  fn(); refresh();
}
function fill(node, child) { node.innerHTML = ''; node.appendChild(child); }
function refresh() {
  let F, res;
  if (APP.override) { F = APP.override.F; res = APP.override.res; }
  else { F = DEC.deriveFlows(APP.S); res = C.evaluate(F, APP.scen); }
  res.F = F; APP.res = res;
  const items = problems(res);
  const B = UI.box;
  if (B.status) fill(B.status, statusBanner(res, items));
  if (B.kpi)   { B.kpi.innerHTML = ''; B.kpi.appendChild(kpiCards(res)); B.kpi.appendChild(changeStrip(res)); }
  if (B.chart) fill(B.chart, costCo2Chart());
  if (B.snaps) fill(B.snaps, snapList());
  if (B.map)   fill(B.map, renderMap(res, F));
  if (B.cost)  fill(B.cost, panelCost(res));
  if (B.co2)   fill(B.co2, panelCO2(res));
  if (B.util)  fill(B.util, panelCap(res));
  if (B.alert) fill(B.alert, alerts(items));
  if (UI.tabBadge) STAGES.forEach(st => {
    const n = items.filter(a => a.stage === st.id).length;
    const b = UI.tabBadge[st.id];
    b.textContent = n ? String(n) : '✓';
    b.className = 'tbadge ' + (n ? 'bad' : 'ok');
    b.title = n ? T('problems') + ': ' + n : T('feasible');
  });
  UI.hooks.forEach(h => { try { h(res, F); } catch (e) {} });
}

// =====================================================================
//  Einstieg und Export
// =====================================================================
function intro() {
  const d = el('details', { class:'card intro' });
  if (APP.introOpen) d.setAttribute('open', '');
  d.addEventListener('toggle', () => { APP.introOpen = d.open; });
  const flow = el('div', { class:'flow' });
  const node = t => el('span', { class:'fnode', text:t });
  flow.appendChild(node(T('supplier')));
  STAGES.forEach((st, i) => {
    flow.appendChild(el('span', { class:'farrow', style:'--c:' + st.col }, [ stageChip(st), el('span', { text:T(st.key) }) ]));
    flow.appendChild(node([T('batplant'), T('vehplant'), T('dc')][i]));
  });
  d.appendChild(el('summary', { text:T('introT') }));
  d.appendChild(el('div', { class:'body' }, [
    el('p', { class:'lead', html:T('introGoal') }),
    flow,
    el('p', { class:'note', text:T('introFlow') }),
    el('p', { class:'note', style:'margin-bottom:0', text:T('introUse') })
  ]));
  return d;
}

function panelExport() {
  const name = el('input', { class:'txt', style:'width:150px', type:'text',
                             value:APP.groupName || '', placeholder:T('group') });
  const out = el('textarea', { readonly:true });
  const btn = el('button', { class:'btn', type:'button', text:T('makeCode') });
  btn.addEventListener('click', () => {
    APP.groupName = name.value;
    out.value = DEC.encode(APP.S, { group:name.value || '?' });
    out.select();
    try { document.execCommand('copy'); btn.textContent = T('copied') + ' ✓';
          setTimeout(() => btn.textContent = T('makeCode'), 1500); } catch (e) {}
  });
  return el('div', {}, [ el('p', { class:'note', style:'margin-top:0', text:T('pExportH') }),
    el('div', { class:'row', style:'margin-bottom:8px' }, [ name, btn ]), out ]);
}

// =====================================================================
//  Vollstaendiger Aufbau
// =====================================================================
function buildHeader() {
  const hd = el('div', { class:'hd' });
  hd.appendChild(el('div', { class:'brand' }, [
    el('h1', { text:T('title') }),
    el('span', { class:'sub', text:TEACH ? T('subTeacher') : T('subStudent') })
  ]));
  const rs = el('button', { class:'pill', type:'button', text:'↺ ' + T('reset'), title:T('resetH') });
  rs.addEventListener('click', () => { APP.S = DEC.basePlan(); APP.beforeKPI = null; APP.override = null;
                                       APP.loaded = null; render(); });
  hd.appendChild(rs);
  const seg = el('div', { class:'seg' });
  ['EN','DE'].forEach(l => {
    const i = l === 'DE' ? 0 : 1;
    const b = el('button', { type:'button', text:l, class:I.cur() === i ? 'on' : '' });
    b.addEventListener('click', () => { I.set(i); document.documentElement.lang = l.toLowerCase(); render(); });
    seg.appendChild(b);
  });
  hd.appendChild(seg);
  return el('header', {}, [hd]);
}

function render() {
  UI.hooks = []; UI.box = {}; UI.chartSources = [];
  const y = window.scrollY;
  const root = document.body;
  root.innerHTML = '';
  root.appendChild(buildHeader());

  const wrap = el('div', { class:'wrap' });
  const left = el('div', { class:'col' }), right = el('div', { class:'col' });

  // linke Spalte: Einstieg, Probleme, Entscheidungen, Abgabe
  left.appendChild(intro());
  UI.box.alert = el('div');
  left.appendChild(el('div', { class:'card' }, [ el('div', { class:'body' }, [ UI.box.alert ]) ]));
  left.appendChild(stageTabs());
  if (!TEACH) left.appendChild(card('pExport', panelExport()));

  // rechte Spalte: Status, Kennzahlen, Diagramm, Speicherpunkte, Karte, Details
  if (APP.override) right.appendChild(el('div', { class:'card mine' }, [ el('div', { class:'body row' }, [
    el('b', { text:'▶ ' + APP.override.label }),
    (function () { const x = el('button', { class:'btn ghost', style:'margin-left:auto', text:T('current') });
      x.addEventListener('click', () => { APP.override = null; render(); }); return x; })() ]) ]));
  UI.box.status = el('div'); right.appendChild(UI.box.status);
  UI.box.kpi = el('div', { class:'card' }); right.appendChild(UI.box.kpi);
  UI.box.chart = el('div', { class:'chartwrap' });
  right.appendChild(el('div', { class:'card' }, [
    el('h2', {}, [ el('span', { text:T('pPareto') }) ]),
    el('div', { class:'body', style:'padding-bottom:4px' }, [ el('p', { class:'note', style:'margin:0 0 6px', text:T('chartH') }), UI.box.chart ]),
    chartLegend() ]));
  UI.box.snaps = el('div');
  right.appendChild(card('pSnaps', el('div', {}, [ panelSnapsStatic(), UI.box.snaps ])));
  UI.box.map = el('div', { class:'mapwrap' });
  right.appendChild(el('div', { class:'card' }, [
    el('h2', {}, [ el('span', { text:T('pMap') }) ]), UI.box.map,
    el('div', { class:'leg' }, [
      el('span', {}, [ stageChip(STAGES[0]), el('b', { text:T('modules') }) ]),
      el('span', {}, [ stageChip(STAGES[1]), el('b', { text:T('batteries') }) ]),
      el('span', {}, [ stageChip(STAGES[2]), el('b', { text:T('vehicles') }) ]),
      el('span', { text:'◆ ' + T('dc') })
    ]) ]));
  UI.box.cost = el('div');  right.appendChild(card('pCost', UI.box.cost));
  UI.box.co2  = el('div');  right.appendChild(card('co2',   UI.box.co2));
  UI.box.util = el('div');  right.appendChild(card('pCap',  UI.box.util));

  if (TEACH && window.VWTEACH) window.VWTEACH.panels(left, right, render);
  if (!TEACH && window.VWSTUD) window.VWSTUD.panels(left, right, render);

  wrap.appendChild(left); wrap.appendChild(right);
  root.appendChild(wrap);
  refresh();
  window.scrollTo(0, y);
}

window.VWAPP = { APP, UI, render, refresh, change, el, card, T, utilBar, barList, numInput, jump,
                 scenColor, scenLabel, scenKey,
                 hook: f => UI.hooks.push(f), chartSource: f => UI.chartSources.push(f) };
document.addEventListener('DOMContentLoaded', render);
})();

</script>
</body>
</html>
